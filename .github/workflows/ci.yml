name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go / ${{ matrix.module }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        module: [., networkboot, windows]
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: '**/go.sum'
      - run: go vet ./...
      - name: Unit, crash/recovery and localhost cluster tests
        if: matrix.module != '.'
        run: go test -race ./... -count=1 -timeout=15m
      - name: Root packages (server suite runs in separate shards)
        if: matrix.module == '.'
        run: |
          python3 - <<'PY'
          import subprocess
          packages = subprocess.check_output(['go', 'list', './...'], text=True).splitlines()
          packages = [p for p in packages if p != 'github.com/launix-de/stqr-storage/server']
          subprocess.run(['go', 'test', '-race', *packages, '-count=1', '-timeout=15m'], check=True)
          PY
      - name: Networkboot tools and PAM harness
        if: matrix.module == 'networkboot'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpam0g-dev dnsmasq-base
          test -f /usr/include/security/pam_modules.h
          make -C .. networkboot
          python3 -m unittest discover -s tests -v
          sh -n initramfs/hooks/stqr initramfs/scripts/stqr

  server:
    name: Go / server shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Disjoint server tests, examples and fuzz seeds with race detector
        run: python3 tools/ci/server-tests.py --shard ${{ matrix.shard }} --shards 4

  debian:
    name: Debian / package and upgrade hooks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: sudo apt-get update && sudo apt-get install -y lintian
      - run: python3 tools/test-deb.py

  dashboard:
    name: Dashboard / Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: node --test server/dashboard_*_test.mjs
      - run: npm ci --prefix tools/ci --no-audit --no-fund
      - run: npm exec --prefix tools/ci -- playwright install --with-deps chromium
      - name: Select the installed browser and module
        working-directory: tools/ci
        run: |
          node - <<'NODE' >> "$GITHUB_ENV"
          console.log('STQR_TEST_BROWSER_MODULE=' + require.resolve('playwright'));
          console.log('STQR_TEST_BROWSER_EXECUTABLE=' + require('playwright').chromium.executablePath());
          NODE
      - name: Real dashboard and PG replication acceptance
        run: go test -race ./server -run 'Browser$' -count=1 -v -timeout=10m

  linux-integration:
    name: Linux / C, FUSE and NBD
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STQR_TEST_C: '1'
      STQR_C_SANITIZE: '1'
      STQR_TEST_FUSE: '1'
      STQR_TEST_NETWORKBOOT: '1'
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      - name: Native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libpam0g-dev fuse3 rsync php-cli qemu-utils
          sudo modprobe fuse
          sudo chmod a+rw /dev/fuse
          test -r /dev/fuse -a -w /dev/fuse
      - run: make c-client c-integration && make -C client/c check
      - run: make nbd
      - run: make networkboot
      - name: Real native clients against disposable localhost fixtures
        # Kernel here means FUSE/VFS mounts, not loading the kstqr module.
        run: go test -race ./client ./server -p=1 -run 'Test(CClient|.*Networkboot.*|.*Kernel.*|.*Rsync.*|BucketNativeOverlayPHPCluster)$' -count=1 -v -timeout=15m

  windows:
    name: Windows / native callbacks and setup
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      CGO_ENABLED: '0'
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: windows/go.mod
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - run: go test ./... -count=1 -timeout=10m
      - name: Install the signed WinFsp runtime for real driver tests
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'winfsp-2.2.26323.msi'
          Invoke-WebRequest 'https://github.com/winfsp/winfsp/releases/download/v2.2/winfsp-2.2.26323.msi' -OutFile $installer
          $expected = '36ce01f9eedbbe6842b7fb4bedc79d7d4f71983e8aceb6877b46a07b331c7e19'
          if ((Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'WinFsp installer SHA256 mismatch'
          }
          $install = Start-Process msiexec.exe -ArgumentList "/i `"$installer`" /quiet /norestart" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "WinFsp installation failed: $($install.ExitCode)" }
      - name: Real WinFsp mount through native Windows file APIs
        env:
          STQR_TEST_WINFSP: '1'
        run: go test . -run '^TestWindowsMounted(Filesystem|NativeOverlay)$' -count=1 -v -timeout=3m
      - name: Publish self-contained WinUI application and Go backend
        shell: pwsh
        run: ./build.ps1
      - name: Native WinUI startup, validation and responsive layout
        shell: pwsh
        run: |
          $env:STQR_UI_SMOKE_DIR = (Resolve-Path bin).Path
          $bundle = Join-Path $env:RUNNER_TEMP 'stqr-deployment-check'
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null
          Copy-Item bin/stqr-windows.exe (Join-Path $bundle 'stqr-windows.exe')
          Copy-Item bin/stqr-windows.ui.exe (Join-Path $bundle 'stqr-windows.ui.exe')
          foreach ($frontend in @('stqr-windows.ui.exe', 'stqr-windows-installed.ui.exe')) {
            if ($frontend -eq 'stqr-windows-installed.ui.exe') {
              Rename-Item (Join-Path $bundle 'stqr-windows.exe') 'stqr-windows-installed.exe'
              Rename-Item (Join-Path $bundle 'stqr-windows.ui.exe') $frontend
            }
            Remove-Item bin/winui-smoke.txt -ErrorAction SilentlyContinue
            $ui = Start-Process (Join-Path $bundle $frontend) -WorkingDirectory $bundle -ArgumentList '--smoke-test' -PassThru
            if (!$ui.WaitForExit(90000)) { $ui.Kill(); throw "WinUI smoke test timed out: $frontend" }
            if ($ui.ExitCode -ne 0) {
              if (Test-Path bin/winui-smoke-error.txt) { Get-Content bin/winui-smoke-error.txt }
              throw "WinUI smoke test failed: $frontend ($($ui.ExitCode))"
            }
            if (!(Test-Path bin/winui-smoke.txt)) { throw "Missing WinUI smoke evidence: $frontend" }
            Get-Content bin/winui-smoke.txt
          }
      - name: Retain the complete Windows bundle and actual UI screenshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-winui
          path: |
            windows/bin/stqr-windows.exe
            windows/bin/stqr-windows.ui.exe
            windows/bin/stqr-winui.png
            windows/bin/winui-smoke.txt
            windows/bin/winui-smoke-error.txt
          if-no-files-found: warn
          retention-days: 14

  format-compatibility:
    name: Tagged formats / upgrade and restart
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      - name: Every tag writes old data; current server and readers verify it
        run: |
          python3 -m unittest discover -s tools/compat -v
          python3 tools/compat/check.py
      - name: Retain per-version manifests and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: format-compatibility
          path: .compat-reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
